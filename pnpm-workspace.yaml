# Монорепо: локальные пакеты в packages/* (vite-plugin-smart-assets и будущие),
# линкуются в node_modules как workspace:* зависимости корневого проекта.
packages:
  - packages/*

# Сборочные скрипты зависимостей, которым pnpm разрешает выполняться
# (pnpm 10 по умолчанию блокирует все build-скрипты).
#
# sharp ЗДЕСЬ НЕТ И ЭТО НАМЕРЕННО: его install-скрипт при наличии
# глобального системного libvips (например, пакет из репозитория Arch)
# принудительно уходит в сборку из исходников через node-gyp и валит
# `pnpm install`. Пребилды @img/sharp-<платформа> работают и без этого
# скрипта — runtime грузит платформенный биндинг напрямую.
# Если когда-нибудь понадобится сборка из исходников — вернуть sharp
# в список и выполнить `pnpm approve-builds`.
onlyBuiltDependencies:
  - esbuild
  - puppeteer
